name: Build Baker's Dawgs software packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package.yml'
      - 'index.html'
      - 'admin.html'
      - 'app.js'
      - 'admin.js'
      - 'daily-closeout.js'
      - 'style.css'
      - 'admin.css'
      - 'config.js'
      - 'db.js'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK and install packages
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER=$(find /usr/local/lib/android/sdk -type f -name sdkmanager | head -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Create Android projects
        shell: bash
        run: |
          set -e
          make_app() {
            DIR="$1"; PKG="$2"; TITLE="$3"; URL="$4"
            mkdir -p "$DIR/app/src/main/java/${PKG//.//}" "$DIR/app/src/main/res/values" "$DIR/app/src/main/res/drawable"
            cat > "$DIR/settings.gradle" <<EOF
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "$TITLE"
          include ':app'
          EOF
            cat > "$DIR/build.gradle" <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
            cat > "$DIR/app/build.gradle" <<EOF
          plugins { id 'com.android.application' }
          android { namespace '$PKG'; compileSdk 35
            defaultConfig { applicationId '$PKG'; minSdk 21; targetSdk 35; versionCode 2; versionName '1.1' }
          }
          EOF
            cat > "$DIR/app/src/main/res/values/styles.xml" <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:colorAccent">#c80d0d</item></style></resources>
          EOF
            cat > "$DIR/app/src/main/res/drawable/ic_launcher.xml" <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#C8102E" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#F2B35E" android:pathData="M14,42c0,-9 7,-16 16,-16h48c9,0 16,7 16,16v24c0,9 -7,16 -16,16h-48c-9,0 -16,-7 -16,-16z"/>
            <path android:fillColor="#8B2E16" android:pathData="M25,47c0,-7 6,-13 13,-13h32c7,0 13,6 13,13v14c0,7 -6,13 -13,13h-32c-7,0 -13,-6 -13,-13z"/>
            <path android:strokeColor="#FFD21F" android:strokeWidth="5" android:strokeLineCap="round" android:fillColor="@android:color/transparent" android:pathData="M31,47 C38,39 45,55 52,47 S66,55 76,47"/>
            <path android:strokeColor="#FFFFFF" android:strokeWidth="3" android:strokeLineCap="round" android:fillColor="@android:color/transparent" android:pathData="M32,60 C40,52 47,68 55,60 S68,68 77,60"/>
          </vector>
          EOF
            cat > "$DIR/app/src/main/AndroidManifest.xml" <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/AppTheme" android:label="$TITLE" android:icon="@drawable/ic_launcher"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
            JAVA="$DIR/app/src/main/java/${PKG//.//}/MainActivity.java"
            cat > "$JAVA" <<EOF
          package $PKG;
          import android.app.Activity; import android.os.Bundle; import android.webkit.WebSettings; import android.webkit.WebView; import android.webkit.WebViewClient; import android.webkit.WebChromeClient; import android.content.Intent; import android.net.Uri;
          public class MainActivity extends Activity { WebView w; public void onCreate(Bundle b){super.onCreate(b);w=new WebView(this);setContentView(w);WebSettings s=w.getSettings();s.setJavaScriptEnabled(true);s.setDomStorageEnabled(true);s.setDatabaseEnabled(true);s.setAllowContentAccess(true);s.setAllowFileAccess(true);s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);w.setWebChromeClient(new WebChromeClient());w.setWebViewClient(new WebViewClient(){ @Override public boolean shouldOverrideUrlLoading(WebView view,String url){ if(url.startsWith("http://")||url.startsWith("https://")){view.loadUrl(url);return true;} try{startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));}catch(Exception e){} return true;} });w.clearCache(true);w.clearHistory();w.loadUrl("$URL?v=25");} @Override public void onBackPressed(){if(w.canGoBack())w.goBack();else super.onBackPressed();} }
          EOF
          }
          make_app customer-apk com.bakersdawgs.customer "Baker's Dawgs" "https://lunaracres8-lgtm.github.io/bakers-dawgs-ordering/"
          make_app admin-apk com.bakersdawgs.admin "Baker's Dawgs Admin" "https://lunaracres8-lgtm.github.io/bakers-dawgs-ordering/admin.html"
      - name: Build APKs
        run: |
          timeout 12m gradle -p customer-apk --no-daemon assembleDebug --stacktrace
          timeout 12m gradle -p admin-apk --no-daemon assembleDebug --stacktrace
          mkdir -p dist/customer dist/admin
          cp customer-apk/app/build/outputs/apk/debug/app-debug.apk dist/customer/Bakers_Dawgs_Customer.apk
          cp admin-apk/app/build/outputs/apk/debug/app-debug.apk dist/admin/Bakers_Dawgs_Admin.apk
          cp index.html app.js style.css config.js db.js manifest.json dist/customer/
          cp admin.html admin.js daily-closeout.js admin.css config.js db.js dist/admin/
      - name: Publish permanent APK downloads
        shell: bash
        run: |
          set -e
          mkdir -p downloads
          cp dist/customer/Bakers_Dawgs_Customer.apk downloads/Bakers_Dawgs_Customer.apk
          cp dist/admin/Bakers_Dawgs_Admin.apk downloads/Bakers_Dawgs_Admin.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/*.apk
          git commit -m "Publish latest Baker's Dawgs APK downloads" || true
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: Bakers_Dawgs_Customer_APK
          path: dist/customer/
      - uses: actions/upload-artifact@v4
        with:
          name: Bakers_Dawgs_Admin_APK
          path: dist/admin/