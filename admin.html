<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111"><title>Baker's Dawgs Admin</title><link rel="stylesheet" href="admin.css"></head>
<body><header><div><h1>BAKER'S <span>DAWGS</span></h1><p>Restaurant Order Board</p></div><div id="clock"></div></header>
<div id="login" class="login"><section><h2>Admin Access</h2><p>Enter the restaurant PIN.</p><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN"><button onclick="login()">OPEN ORDER BOARD</button><small>Change the default PIN in admin.js before public launch.</small></section></div>
<main id="app" class="hidden"><div class="toolbar"><div><b id="openCount">0</b> open orders</div><button onclick="seedDemo()">+ Demo Order</button><button onclick="clearCompleted()">Clear Completed</button><button onclick="logout()">Lock</button></div>
<nav><button onclick="filterOrders('all')">All</button><button onclick="filterOrders('New')">New</button><button onclick="filterOrders('Accepted')">Accepted</button><button onclick="filterOrders('Cooking')">Cooking</button><button onclick="filterOrders('Ready')">Ready</button><button onclick="filterOrders('Completed')">Completed</button></nav>
<section id="orders" class="orders"></section></main><script src="config.js"></script><script src="db.js"></script><script src="admin.js"></script></body></html>
