<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111"><title>Baker's Dawgs Admin</title><link rel="stylesheet" href="admin.css"></head>
<body><header><div><h1>BAKER'S <span>DAWGS</span></h1><p>Restaurant Order Board</p></div><div id="clock"></div></header>
<div id="login" class="login"><section><h2>Admin Access</h2><p>Sign in with the restaurant staff account.</p><input id="email" type="email" autocomplete="username" placeholder="Staff email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button onclick="login()">OPEN ORDER BOARD</button><button id="forgotBtn" type="button" class="forgot">Forgot password?</button><small>Staff access is protected by Supabase authentication.</small></section></div>
<main id="app" class="hidden"><div class="toolbar"><div class="orderCounts"><span><b id="openCount">0</b> Open</span><span><b id="newCount">0</b> New</span><span><b id="readyCount">0</b> Ready</span></div><button id="completedToggle" onclick="toggleCompleted()">Hide Completed</button><button onclick="logout()">Lock</button></div>
<section class="metrics"><div><b id="ordersToday">0</b><small>Orders Today</small></div><div><b id="salesToday">$0.00</b><small>Completed Sales</small></div><div><b id="avgTicket">$0.00</b><small>Avg Ticket</small></div></section><nav><button onclick="filterOrders('all')">All</button><button onclick="filterOrders('New')">New</button><button onclick="filterOrders('Accepted')">Accepted</button><button onclick="filterOrders('Cooking')">Cooking</button><button onclick="filterOrders('Ready')">Ready</button><button onclick="filterOrders('Completed')">Completed</button></nav>
<section id="orders" class="orders"></section></main><script src="config.js?v=13"></script><script src="db.js?v=13"></script><script src="admin.js?v=13"></script></body></html>
